
<p class="text-gray-800 mb-4">Este é o meu componente Angular.</p>


<h1 class="text-3xl font-bold text-gray-900 mb-4">
  Bem-vindo ao mundo angular moderno!
</h1>


<button [disabled]="isDisabled" (click)="onClick()"
 class="px-4 py-2
 bg-blue-500 text-white font-semibold rounded-lg
 shadow-md disabled:opacity-50
   ">
  Clique aqui!
</button>
<h1 class=" text-2xl m-5">Count: {{ count() }}</h1>
<h1 class=" text-2xl m-5">DoubleCount: {{ doubleCount() }}</h1>
<button class="px-4 py-2 bg-indigo-600 text-white font-semibold rounded-lg shadow-md" (click)="incrementCounter()">+</button>
<button class="px-4 py-2 bg-indigo-600 text-white font-semibold rounded-lg shadow-md" (click)="decrementCounter()">-</button>
<button class="px-4 py-2 bg-indigo-600 text-white font-semibold rounded-lg shadow-md" (click)="resetCounter()">reset</button>
